name: Executáveis

on:
  push:
    branches: [main, painel-mestre-licencas]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIStrider --icon assets/aistrider.ico run.py
      - name: Testar o executável
        shell: pwsh
        run: |
          $p = Start-Process dist\AIStrider.exe -ArgumentList "--sem-navegador" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:8788/licencas -UseBasicParsing; $ok = $r.Content -match "Painel mestre" } catch {}
          }
          Stop-Process $p.Id -Force
          if (-not $ok) { throw "O AIStrider.exe não abriu a aba de licenças" }
      - uses: actions/upload-artifact@v4
        with:
          name: AIStrider-windows
          path: dist/AIStrider.exe

  android:
    needs: testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r ../requirements.txt
      - run: python build_www.py
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: tablet/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AIStrider-tablet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AIStrider-tablet
          path: tablet/AIStrider-tablet.apk

  publicar:
    needs: [windows, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - name: Publicar na página de versões
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.ref_name }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" saida/AIStrider.exe saida/AIStrider-tablet.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "AI Strider (${{ github.ref_name }})" \
            --notes "Windows: AIStrider.exe. Tablet Android: AIStrider-tablet.apk (instalar permitindo fontes desconhecidas)."
